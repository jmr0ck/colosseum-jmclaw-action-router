<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BlinkGuard Pixel">
  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="crisp">
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 1"/>
      </feComponentTransfer>
    </filter>
    <style>
      .px { shape-rendering: crispEdges; image-rendering: pixelated; }
      .o { fill:#0b0f19; }      /* outline */
      .b { fill:#05060a; }      /* deep black */
      .w { fill:#e9eefc; }      /* highlight */
      .g { fill:url(#sol); }    /* solana gradient */
      .s { fill:#111827; }      /* shield dark */
    </style>
  </defs>

  <!-- black bg -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Pixel art built on a 16px grid -->
  <g class="px" filter="url(#crisp)">

    <!-- Cute claw (left) -->
    <!-- outline blob -->
    <g class="o">
      <rect x="96" y="200" width="16" height="16"/>
      <rect x="112" y="184" width="16" height="16"/>
      <rect x="128" y="168" width="16" height="16"/>
      <rect x="144" y="168" width="16" height="16"/>
      <rect x="160" y="184" width="16" height="16"/>
      <rect x="176" y="200" width="16" height="16"/>

      <rect x="80" y="216" width="16" height="16"/>
      <rect x="80" y="232" width="16" height="16"/>
      <rect x="80" y="248" width="16" height="16"/>

      <rect x="96" y="264" width="16" height="16"/>
      <rect x="112" y="280" width="16" height="16"/>
      <rect x="128" y="296" width="16" height="16"/>
      <rect x="144" y="296" width="16" height="16"/>
      <rect x="160" y="280" width="16" height="16"/>
      <rect x="176" y="264" width="16" height="16"/>

      <rect x="192" y="216" width="16" height="16"/>
      <rect x="192" y="232" width="16" height="16"/>
      <rect x="192" y="248" width="16" height="16"/>

      <!-- fingers/claws -->
      <rect x="112" y="168" width="16" height="16"/>
      <rect x="144" y="168" width="16" height="16"/>
      <rect x="176" y="200" width="16" height="16"/>
      <rect x="96" y="200" width="16" height="16"/>
    </g>

    <!-- claw fill -->
    <g class="g">
      <rect x="96" y="216" width="16" height="16"/>
      <rect x="96" y="232" width="16" height="16"/>
      <rect x="96" y="248" width="16" height="16"/>

      <rect x="112" y="200" width="16" height="16"/>
      <rect x="112" y="216" width="16" height="16"/>
      <rect x="112" y="232" width="16" height="16"/>
      <rect x="112" y="248" width="16" height="16"/>
      <rect x="112" y="264" width="16" height="16"/>

      <rect x="128" y="184" width="16" height="16"/>
      <rect x="128" y="200" width="16" height="16"/>
      <rect x="128" y="216" width="16" height="16"/>
      <rect x="128" y="232" width="16" height="16"/>
      <rect x="128" y="248" width="16" height="16"/>
      <rect x="128" y="264" width="16" height="16"/>
      <rect x="128" y="280" width="16" height="16"/>

      <rect x="144" y="184" width="16" height="16"/>
      <rect x="144" y="200" width="16" height="16"/>
      <rect x="144" y="216" width="16" height="16"/>
      <rect x="144" y="232" width="16" height="16"/>
      <rect x="144" y="248" width="16" height="16"/>
      <rect x="144" y="264" width="16" height="16"/>
      <rect x="144" y="280" width="16" height="16"/>

      <rect x="160" y="200" width="16" height="16"/>
      <rect x="160" y="216" width="16" height="16"/>
      <rect x="160" y="232" width="16" height="16"/>
      <rect x="160" y="248" width="16" height="16"/>
      <rect x="160" y="264" width="16" height="16"/>

      <rect x="176" y="216" width="16" height="16"/>
      <rect x="176" y="232" width="16" height="16"/>
      <rect x="176" y="248" width="16" height="16"/>
    </g>

    <!-- highlights -->
    <g class="w" opacity="0.9">
      <rect x="128" y="216" width="16" height="16"/>
      <rect x="144" y="232" width="16" height="16"/>
      <rect x="112" y="232" width="16" height="16"/>
    </g>

    <!-- Pixel shield (right) -->
    <g>
      <!-- outline -->
      <g class="o">
        <rect x="304" y="160" width="16" height="16"/>
        <rect x="320" y="144" width="16" height="16"/>
        <rect x="336" y="144" width="16" height="16"/>
        <rect x="352" y="144" width="16" height="16"/>
        <rect x="368" y="144" width="16" height="16"/>
        <rect x="384" y="160" width="16" height="16"/>

        <rect x="288" y="176" width="16" height="16"/>
        <rect x="288" y="192" width="16" height="16"/>
        <rect x="288" y="208" width="16" height="16"/>
        <rect x="288" y="224" width="16" height="16"/>
        <rect x="288" y="240" width="16" height="16"/>
        <rect x="288" y="256" width="16" height="16"/>

        <rect x="400" y="176" width="16" height="16"/>
        <rect x="400" y="192" width="16" height="16"/>
        <rect x="400" y="208" width="16" height="16"/>
        <rect x="400" y="224" width="16" height="16"/>
        <rect x="400" y="240" width="16" height="16"/>
        <rect x="400" y="256" width="16" height="16"/>

        <rect x="304" y="288" width="16" height="16"/>
        <rect x="320" y="304" width="16" height="16"/>
        <rect x="336" y="320" width="16" height="16"/>
        <rect x="352" y="320" width="16" height="16"/>
        <rect x="368" y="304" width="16" height="16"/>
        <rect x="384" y="288" width="16" height="16"/>
      </g>

      <!-- fill -->
      <g class="s">
        <rect x="304" y="176" width="16" height="16"/>
        <rect x="320" y="160" width="16" height="16"/>
        <rect x="336" y="160" width="16" height="16"/>
        <rect x="352" y="160" width="16" height="16"/>
        <rect x="368" y="160" width="16" height="16"/>
        <rect x="384" y="176" width="16" height="16"/>

        <rect x="304" y="192" width="96" height="16"/>
        <rect x="304" y="208" width="96" height="16"/>
        <rect x="304" y="224" width="96" height="16"/>
        <rect x="304" y="240" width="96" height="16"/>
        <rect x="304" y="256" width="96" height="16"/>

        <rect x="320" y="272" width="64" height="16"/>
        <rect x="336" y="288" width="32" height="16"/>
      </g>

      <!-- badge gradient bolt -->
      <g class="g">
        <rect x="344" y="192" width="16" height="16"/>
        <rect x="360" y="192" width="16" height="16"/>
        <rect x="360" y="208" width="16" height="16"/>
        <rect x="328" y="208" width="16" height="16"/>
        <rect x="328" y="224" width="16" height="16"/>
        <rect x="344" y="224" width="16" height="16"/>
        <rect x="344" y="240" width="16" height="16"/>
      </g>

      <!-- tiny check sparkle -->
      <g class="w">
        <rect x="320" y="176" width="16" height="16"/>
        <rect x="336" y="192" width="16" height="16"/>
        <rect x="352" y="208" width="16" height="16"/>
      </g>
    </g>

    <!-- Title pixels (BG) -->
    <g class="o" opacity="0.85">
      <rect x="120" y="368" width="16" height="16"/>
      <rect x="136" y="368" width="16" height="16"/>
      <rect x="152" y="368" width="16" height="16"/>
      <rect x="168" y="368" width="16" height="16"/>
      <rect x="184" y="368" width="16" height="16"/>
      <rect x="200" y="368" width="16" height="16"/>
      <rect x="216" y="368" width="16" height="16"/>
      <rect x="232" y="368" width="16" height="16"/>
      <rect x="248" y="368" width="16" height="16"/>
      <rect x="264" y="368" width="16" height="16"/>
      <rect x="280" y="368" width="16" height="16"/>
      <rect x="296" y="368" width="16" height="16"/>
      <rect x="312" y="368" width="16" height="16"/>
      <rect x="328" y="368" width="16" height="16"/>
      <rect x="344" y="368" width="16" height="16"/>
      <rect x="360" y="368" width="16" height="16"/>
    </g>

    <!-- simple pixel wordmark (BG) -->
    <g class="g" opacity="0.95">
      <!-- BLINK -->
      <rect x="120" y="384" width="16" height="16"/>
      <rect x="120" y="400" width="16" height="16"/>
      <rect x="120" y="416" width="16" height="16"/>
      <rect x="136" y="384" width="16" height="16"/>
      <rect x="152" y="384" width="16" height="16"/>
      <rect x="136" y="416" width="16" height="16"/>
      <rect x="152" y="416" width="16" height="16"/>

      <rect x="184" y="384" width="16" height="48"/>

      <rect x="216" y="384" width="16" height="48"/>
      <rect x="232" y="416" width="16" height="16"/>

      <rect x="264" y="384" width="16" height="48"/>
      <rect x="280" y="384" width="16" height="16"/>
      <rect x="296" y="400" width="16" height="16"/>
      <rect x="312" y="416" width="16" height="16"/>

      <rect x="344" y="384" width="16" height="48"/>
      <rect x="360" y="384" width="16" height="16"/>
      <rect x="360" y="416" width="16" height="16"/>
    </g>
  </g>
</svg>
